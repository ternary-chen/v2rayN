name: Build learning macOS ARM64 test package
on:
  workflow_dispatch:
  push:
    branches: [feature/limited-learning-codex-proxy]
    paths:
      - '.github/workflows/build-learning-macos.yml'
      - 'scripts/package-learning-macos.py'
      - 'v2rayN/AdaptiveRouting/**'
      - 'v2rayN/AdaptiveRouting.SmokeTests/**'
      - 'v2rayN/PolicyIntegration.SmokeTests/**'
      - 'v2rayN/ConnectionLogging.SmokeTests/**'
      - 'v2rayN/CustomUpdate.SmokeTests/**'
      - 'v2rayN/CustomUpdate.Fixture/**'
      - 'v2rayN/CustomUpdater/**'
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/v2rayN.Desktop/**'
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Download pinned core and geo data
        run: python3 scripts/package-learning-macos.py download --directory "$RUNNER_TEMP/learning-dependencies"
      - name: Run targeted routing checks on macOS
        env:
          TEST_XRAY_EXE: ${{ runner.temp }}/learning-dependencies/xray
          TEST_XRAY_GEOSITE: ${{ runner.temp }}/learning-dependencies
        run: |
          # The shipped core is ARM64; code signing/cross-publishing also work on Intel macOS.
          if [ "$(uname -m)" != arm64 ]; then unset TEST_XRAY_EXE; fi
          dotnet run --project v2rayN/AdaptiveRouting.SmokeTests/AdaptiveRouting.SmokeTests.csproj
          dotnet run --project v2rayN/PolicyIntegration.SmokeTests/PolicyIntegration.SmokeTests.csproj
          dotnet run --project v2rayN/ConnectionLogging.SmokeTests/ConnectionLogging.SmokeTests.csproj
      - name: Check updater replacement and rollback on macOS
        run: |
          dotnet build v2rayN/CustomUpdate.Fixture/CustomUpdate.Fixture.csproj
          export UPDATE_FIXTURE_DIR="$GITHUB_WORKSPACE/v2rayN/CustomUpdate.Fixture/bin/Debug/net10.0"
          dotnet run --project v2rayN/CustomUpdate.SmokeTests/CustomUpdate.SmokeTests.csproj
      - name: Publish Apple Silicon client
        run: dotnet publish v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -r osx-arm64 --self-contained true -o "$RUNNER_TEMP/learning-publish"
      - name: Publish independent update helper
        run: dotnet publish v2rayN/CustomUpdater/CustomUpdater.csproj -c Release -r osx-arm64 --self-contained true -o "$RUNNER_TEMP/learning-updater"
      - name: Package and ad-hoc sign application
        run: python3 scripts/package-learning-macos.py package --publish "$RUNNER_TEMP/learning-publish" --helper "$RUNNER_TEMP/learning-updater/CustomUpdater" --dependencies "$RUNNER_TEMP/learning-dependencies" --output "$RUNNER_TEMP/learning-release" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: learning-macos-arm64
          path: ${{ runner.temp }}/learning-release/*
          if-no-files-found: error
          retention-days: 14
